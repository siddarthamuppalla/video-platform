server {
  listen 80;
  root /usr/share/nginx/html;

  # Chunks are 5 MB; leave headroom.
  client_max_body_size 8m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_request_buffering off;
  }

  location /media/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
